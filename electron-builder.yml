appId: br.com.wadge.browser
productName: WD - Navegador
directories:
  output: release
  buildResources: build
files:
  - out/**
  - build/icon.png
  - package.json
asar: true
win:
  target:
    - target: nsis
      arch: [x64]
  icon: build/icon.ico
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  artifactName: WD-Navegador-Setup-${version}.${ext}
publish:
  provider: github
  owner: wesleiad
  repo: wd-navegador
  releaseType: release
